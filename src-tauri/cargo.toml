[package]
name = "jeympt"
version = "1.0.0"
description = "Jeympt — Organize. Execute. Keep Moving."
edition = "2021"

[lib]
name = "jeympt_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
